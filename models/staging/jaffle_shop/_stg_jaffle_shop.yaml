models:
  - name: stg_jaffle_shop__customers
    decription: The grain of this table is one unique customer per row
    columns:
      - name: customer_id
        description: Primary key of the customers table
        tests:
          - unique
          - not_null
  - name: stg_jaffle_shop__orders
    decription: The grain of this table is one unique customer per row
    columns:
    description: Primary key for the orders table
      - name: order_id
        tests:
         - unique
         - not_null
      - name: order_status
        description: "{{ docs ('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id